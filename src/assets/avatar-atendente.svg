<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c2a"/>
      <stop offset="100%" style="stop-color:#2d8a3e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4956a"/>
      <stop offset="100%" style="stop-color:#c07a50"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c2a"/>
      <stop offset="100%" style="stop-color:#0f3314"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="160" cy="40" r="50" fill="rgba(255,255,255,0.06)"/>
  <circle cx="30" cy="170" r="60" fill="rgba(255,255,255,0.05)"/>

  <!-- Body / shirt -->
  <ellipse cx="100" cy="195" rx="68" ry="48" fill="url(#shirt)" clip-path="url(#circle)"/>

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="22" rx="8" fill="url(#skin)"/>

  <!-- Collar -->
  <path d="M 68 155 Q 100 140 132 155 L 132 200 L 68 200 Z" fill="#145220" clip-path="url(#circle)"/>
  <path d="M 100 140 L 88 160 L 100 155 L 112 160 Z" fill="white" opacity="0.15"/>

  <!-- Head -->
  <ellipse cx="100" cy="96" rx="34" ry="38" fill="url(#skin)"/>

  <!-- Hair -->
  <path d="M 66 88 Q 68 58 100 56 Q 132 58 134 88 Q 128 70 100 68 Q 72 70 66 88 Z" fill="#2a1a0a"/>
  <ellipse cx="100" cy="62" rx="34" ry="14" fill="#2a1a0a"/>

  <!-- Ears -->
  <ellipse cx="66" cy="98" rx="6" ry="8" fill="#c07a50"/>
  <ellipse cx="134" cy="98" rx="6" ry="8" fill="#c07a50"/>

  <!-- Eyes -->
  <ellipse cx="88" cy="96" rx="5" ry="5.5" fill="white"/>
  <ellipse cx="112" cy="96" rx="5" ry="5.5" fill="white"/>
  <circle cx="89" cy="97" r="3" fill="#2a1a0a"/>
  <circle cx="113" cy="97" r="3" fill="#2a1a0a"/>
  <circle cx="90" cy="96" r="1" fill="white"/>
  <circle cx="114" cy="96" r="1" fill="white"/>

  <!-- Eyebrows -->
  <path d="M 82 89 Q 88 86 94 89" stroke="#2a1a0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 106 89 Q 112 86 118 89" stroke="#2a1a0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 100 100 Q 96 108 98 110 Q 100 112 102 110 Q 104 108 100 100" fill="#b86e44" opacity="0.6"/>

  <!-- Smile -->
  <path d="M 90 116 Q 100 124 110 116" stroke="#b86e44" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Headset band -->
  <path d="M 66 88 Q 100 52 134 88" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Headset left ear cup -->
  <rect x="56" y="90" width="16" height="20" rx="6" fill="#111"/>
  <rect x="59" y="93" width="10" height="14" rx="4" fill="#25D366"/>

  <!-- Headset right ear cup -->
  <rect x="128" y="90" width="16" height="20" rx="6" fill="#111"/>
  <rect x="131" y="93" width="10" height="14" rx="4" fill="#25D366"/>

  <!-- Mic boom -->
  <path d="M 72 104 Q 68 120 74 126" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="74" cy="128" r="4" fill="#25D366"/>

  <!-- WhatsApp badge bottom -->
  <circle cx="100" cy="182" r="14" fill="#25D366" clip-path="url(#circle)"/>
  <text x="100" y="187" text-anchor="middle" font-size="14" fill="white">💬</text>
</svg>
