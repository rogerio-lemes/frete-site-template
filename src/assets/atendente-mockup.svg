<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c2a"/>
      <stop offset="100%" style="stop-color:#2d8a3e"/>
    </linearGradient>
    <linearGradient id="truck-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8f5e9"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4f20"/>
      <stop offset="100%" style="stop-color:#0f3314"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundedCard">
      <rect width="480" height="600" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="480" height="600" fill="url(#bg)"/>

  <!-- Decorative circles background -->
  <circle cx="420" cy="80" r="120" fill="rgba(255,255,255,0.05)"/>
  <circle cx="60" cy="500" r="150" fill="rgba(255,255,255,0.04)"/>
  <circle cx="380" cy="420" r="80" fill="rgba(255,255,255,0.04)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </pattern>
  <rect width="480" height="600" fill="url(#grid)"/>

  <!-- Road at bottom -->
  <rect x="0" y="480" width="480" height="120" fill="url(#road)"/>
  <rect x="0" y="478" width="480" height="6" fill="#1a8c2f" opacity="0.6"/>

  <!-- Road dashes -->
  <rect x="0" y="530" width="60" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="90" y="530" width="60" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="180" y="530" width="60" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="270" y="530" width="60" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="360" y="530" width="60" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="450" y="530" width="60" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>

  <!-- Truck body (main) -->
  <g filter="url(#shadow)" transform="translate(60, 370)">
    <!-- Cargo container -->
    <rect x="80" y="20" width="200" height="110" rx="10" fill="url(#truck-body)" stroke="#c8e6c9" stroke-width="2"/>
    <!-- Green stripe on container -->
    <rect x="80" y="20" width="200" height="18" rx="10" fill="#2d8a3e"/>
    <rect x="80" y="30" width="200" height="8" fill="#2d8a3e"/>
    <!-- Lúcio Fretes text on container -->
    <text x="180" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="20" fill="#1a5c2a">LÚCIO</text>
    <text x="180" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="20" fill="#1a5c2a">FRETES</text>
    <!-- Truck cabin -->
    <path d="M 20 50 L 80 50 L 80 130 L 20 130 Q 5 130 5 115 L 5 80 Q 5 50 20 50 Z" fill="#1a5c2a"/>
    <!-- Windshield -->
    <path d="M 22 58 L 72 58 L 72 95 L 22 95 Q 10 95 10 83 L 10 70 Q 10 58 22 58 Z" fill="#a5d6a7" opacity="0.8"/>
    <!-- Headlight -->
    <ellipse cx="12" cy="118" rx="10" ry="8" fill="#fff9c4" opacity="0.9"/>
    <!-- Front bumper -->
    <rect x="5" y="122" width="76" height="10" rx="4" fill="#145220"/>
    <!-- Wheels -->
    <circle cx="50" cy="138" r="22" fill="#1a1a1a"/>
    <circle cx="50" cy="138" r="14" fill="#333"/>
    <circle cx="50" cy="138" r="6" fill="#666"/>
    <circle cx="220" cy="138" r="22" fill="#1a1a1a"/>
    <circle cx="220" cy="138" r="14" fill="#333"/>
    <circle cx="220" cy="138" r="6" fill="#666"/>
    <!-- Wheel shine -->
    <circle cx="50" cy="138" r="22" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="220" cy="138" r="22" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <!-- Door line -->
    <line x1="80" y1="50" x2="80" y2="130" stroke="#c8e6c9" stroke-width="2"/>
  </g>

  <!-- Logo badge (top center) -->
  <g transform="translate(170, 30)" filter="url(#shadow)">
    <!-- Hexagon logo background -->
    <polygon points="80,8 140,44 140,116 80,152 20,116 20,44" fill="#ffffff"/>
    <polygon points="80,16 132,48 132,112 80,144 28,112 28,48" fill="#2d8a3e"/>
    <!-- Truck icon inside logo -->
    <text x="80" y="78" text-anchor="middle" font-size="38" fill="white">🚚</text>
    <!-- Brand name -->
    <text x="80" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="white" letter-spacing="1">LÚCIO</text>
    <text x="80" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="white" letter-spacing="1">FRETES</text>
  </g>

  <!-- Stars row -->
  <text x="240" y="232" text-anchor="middle" font-size="30" fill="#FFD700" filter="url(#glow)">★ ★ ★ ★ ★</text>

  <!-- Rating badge -->
  <g transform="translate(125, 244)">
    <rect width="230" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="115" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="white">Avaliação 5.0 no Google</text>
  </g>

  <!-- WhatsApp badge -->
  <g transform="translate(30, 290)">
    <rect width="200" height="52" rx="26" fill="#25D366"/>
    <!-- WhatsApp icon simple -->
    <circle cx="26" cy="26" r="14" fill="rgba(255,255,255,0.25)"/>
    <text x="26" y="31" text-anchor="middle" font-size="16" fill="white">💬</text>
    <text x="110" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="white">Fale pelo</text>
    <text x="110" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="white">WhatsApp</text>
  </g>

  <!-- 24h badge -->
  <g transform="translate(255, 290)">
    <rect width="195" height="52" rx="26" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="rgba(255,255,255,0.15)"/>
    <text x="26" y="31" text-anchor="middle" font-size="16" fill="white">⏰</text>
    <text x="115" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="white">Disponível</text>
    <text x="115" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="white">24 horas</text>
  </g>

  <!-- Location tag -->
  <g transform="translate(130, 358)">
    <rect width="220" height="36" rx="18" fill="rgba(0,0,0,0.25)"/>
    <text x="110" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="13" fill="rgba(255,255,255,0.9)">📍 Uberlândia e região</text>
  </g>

  <!-- Bottom tagline -->
  <text x="240" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="13" fill="rgba(255,255,255,0.6)">luciofretes.com.br</text>
</svg>
